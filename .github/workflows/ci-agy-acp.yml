name: "CI: agy-acp"

on:
  pull_request:
    paths:
      - "agy-acp/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-07-13)

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agy-acp/target
          key: agy-acp-${{ runner.os }}-${{ hashFiles('agy-acp/Cargo.lock') }}

      - name: Build
        working-directory: agy-acp
        run: cargo build --release

      - name: Run tests
        working-directory: agy-acp
        run: cargo test -- --include-ignored --skip e2e
